<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SafeRoute">
  <title>SafeRoute</title>
  <rect width="64" height="64" rx="14" fill="#0f2740"/>

  <!-- Rodovia em perspectiva: estreita no horizonte, larga na base. -->
  <path d="M26 30 L38 30 L52 62 L12 62 Z" fill="#cbd5e1"/>
  <path d="M30.4 30 L33.6 30 L35.2 40 L28.8 40 Z" fill="#facc15"/>
  <path d="M27.2 45 L36.8 45 L39.4 62 L24.6 62 Z" fill="#facc15"/>

  <!-- Placa de advertência com interrogação: o elemento que sobrevive na miniatura. -->
  <g transform="translate(39 24) rotate(45)">
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#facc15" stroke="#0f2740" stroke-width="4"/>
  </g>
  <text x="39" y="24" fill="#0f2740" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="25" font-weight="900" text-anchor="middle" dominant-baseline="central">?</text>
</svg>
